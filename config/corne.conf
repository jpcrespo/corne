# nombre del dispositivo
CONFIG_ZMK_KEYBOARD_NAME="JpiCorne"

# nombre BT del dispositivo
CONFIG_BT_DEVICE_NAME="JpiCorne"


# potencia de transmision BT

# Maxima potencia
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Potencia media
# CONFIG_BT_CTLR_TX_PWR_0=y

# Potencia baja
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y


# modo reposo automático
CONFIG_ZMK_SLEEP=y

# tiempo de inactividad antes del modo reposo (ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1000000


# luces del teclado
CONFIG_ZMK_RGB_UNDERGLOW=y

# on luces automatico en inicio
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# efecto inicial: 0 = solido
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# alimentacion externa para luces underglow
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# brillo inicial: 0-100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=0


# pantalla OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y


# muestra modo activo wireless o wired
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# estado de capas activas
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# velocidad palabras por minuto
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# estado de bateria
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y

# muestra porcentaje de bateria
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
